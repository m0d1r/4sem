<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Иванов Иван</title>
</head>

<body>
    <h3>Горизонтальные линии</h3>
    <p>Выберите значения параметров, которые требуется изменить, и нажмите кнопку Выполнить.</p>
    <form>
        <label>Ширина (px): <input type="number" id="width" value="400" step="10"></label><br>
        <label>Выравнивание:
            <select id="align">
                <option value="left">Влево</option>
                <option value="center" selected>По центру</option>
                <option value="right">Вправо</option>
            </select>
        </label><br>
        <label>Цвет: <input type="color" id="color" value="#000000"></label><br>
        <button type="button" onclick="applyStyles()">Выполнить</button>
    </form>
    <hr id="demoHr" style="height: 5px; background-color: black; border: none; width: 400px; margin: 20px auto;">
    <script>
        function applyStyles() {
            let hr = document.getElementById('demoHr');
            let w = document.getElementById('width').value;
            let align = document.getElementById('align').value;
            let col = document.getElementById('color').value;
            hr.style.width = w + 'px';
            hr.style.backgroundColor = col;
            if (align === 'left') hr.style.margin = '20px 0';
            else if (align === 'center') hr.style.margin = '20px auto';
            else if (align === 'right') hr.style.margin = '20px 0 20px auto';
        }
    </script>
</body>

</html>
