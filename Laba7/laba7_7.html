<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Горизонтальная линия</title>
</head>

<body>
    <p>Выберите значения параметров, которые требуется изменить, и нажмите кнопку Выполнить.</p>
    <div>
        <div><label>Ширина (px):</label> <input type="number" id="width" value="400" step="10"></div>
        <div><label>Толщина (px):</label> <input type="number" id="height" value="5" step="1"></div>
        <div>
            <label>Выравнивание:</label>
            <label><input type="radio" name="align" value="left"> Влево</label>
            <label><input type="radio" name="align" value="center" checked> По центру</label>
            <label><input type="radio" name="align" value="right"> Вправо</label>
        </div>
        <div><label>Цвет:</label> <input type="color" id="color" value="#000000"></div>
        <div><button type="button" id="applyBtn">Выполнить</button></div>
    </div>
    <hr id="demoHr">
    <script>
        const hr = document.getElementById('demoHr');
        const widthInp = document.getElementById('width');
        const heightInp = document.getElementById('height');
        const alignRadios = document.querySelectorAll('input[name="align"]');
        const colorInp = document.getElementById('color');
        const btn = document.getElementById('applyBtn');

        function getAlign() {
            for (let r of alignRadios) if (r.checked) return r.value;
            return 'center';
        }

        function apply() {
            hr.style.width = widthInp.value + 'px';
            hr.style.height = heightInp.value + 'px';
            hr.style.backgroundColor = colorInp.value;
            const a = getAlign();
            if (a === 'left') hr.style.margin = '20px 0';
            else if (a === 'center') hr.style.margin = '20px auto';
            else hr.style.margin = '20px 0 20px auto';
        }
        btn.onclick = apply;
        apply();
    </script>
</body>

</html>
