<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <table border="1" id="data-table">
        <tr>
            <td>1:1</td>
            <td>1:2</td>
            <td>1:3</td>
            <td>1:4</td>
            <td>1:5</td>
            <td>1:6</td>
        </tr>
        <tr>
            <td>2:1</td>
            <td>2:2</td>
            <td>2:3</td>
            <td>2:4</td>
            <td>2:5</td>
            <td>2:6</td>
        </tr>
        <tr>
            <td>3:1</td>
            <td>3:2</td>
            <td>3:3</td>
            <td>3:4</td>
            <td>3:5</td>
            <td>3:6</td>
        </tr>
        <tr>
            <td>4:1</td>
            <td>4:2</td>
            <td>4:3</td>
            <td>4:4</td>
            <td>4:5</td>
            <td>4:6</td>
        </tr>
    </table>
    <script>
        let cells = document.querySelectorAll('#data-table td');
        for (let cell of cells) {
            let parts = cell.textContent.split(':');
            let i = parseInt(parts[0], 10);
            let j = parseInt(parts[1], 10);
            if ((i + j) % 2 === 0) {
                cell.style.backgroundColor = 'red';
            }
        }
    </script>
</body>

</html>
